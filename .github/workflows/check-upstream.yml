name: Check upstream dsh

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Compare pinned and published versions
        id: versions
        shell: bash
        run: |
          PINNED=$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")
          LATEST=$(npm view @deepseek-ai/dsh version)
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$PINNED" != "$LATEST" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open candidate upgrade issue
        if: steps.versions.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Candidate dsh upgrade: ${{ steps.versions.outputs.latest }}`;
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (!existing.data.some(issue => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `Pinned: ${{ steps.versions.outputs.pinned }}\nPublished: ${{ steps.versions.outputs.latest }}\n\nDo not merge until startup, session, tool-call, configuration compatibility, and packaging tests pass.`
              });
            }
