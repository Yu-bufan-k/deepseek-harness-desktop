name: Check DeepSeek pricing

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  pricing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-pricing.mjs
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('pricing-check.json', 'utf8'));
            if (!result.changed) return;
            const title = 'DeepSeek 官方价格可能已变化';
            const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open' });
            if (existing.data.some(issue => issue.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `每日检测发现官方价格页面内容或可用性需要复核。\n\n缺失关键值：${result.missing.join(', ') || '无'}\n不可用来源：${result.unavailable.map(item => `${item.url} (${item.status ?? item.error})`).join(', ') || '无'}\n\n主来源：${result.source}\n检测时间：${result.checkedAt}\n\n请人工核对后更新 \`pricing/prices.json\`。检测流程不会根据网页内容自动改价，因此页面改版不会污染用户账本。`
            });
